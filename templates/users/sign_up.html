{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
    <div class="auth">
        <h1 class="auth__title">Регистрация</h1>

        <form method="post" class="auth__form" novalidate>
            {% csrf_token %}

            {% include "users/partials/form_fields.html" %}

            <button type="submit" class="auth__submit">Создать аккаунт</button>
        </form>

        <p class="auth__alt">Уже есть аккаунт? <a href="{% url 'users:sign_in' %}">Войти</a></p>
    </div>
{% endblock %}
