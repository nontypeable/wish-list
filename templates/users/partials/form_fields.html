{% if form.non_field_errors %}
    <div class="auth__form-errors">{{ form.non_field_errors }}</div>
{% endif %}

{% for field in form %}
    <div class="field field--{{ field.name }}{% if field.errors %} field--invalid{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}
            <div class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
        {% endif %}
    </div>
{% endfor %}
