[project]
name = "wish-list"
version = "0.0.0"
description = "Just wish list, nothing more"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "gunicorn>=23,<28",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "DJ",        # flake8-django
    "I",         # порядок сортировки импортов
    "B",         # bugbear
    "UP",        # устаревший синтаксис
    "SIM", "C4", # упрощения
    "RUF",       # собственные правила ruff
    "PL",        # pylint-правила
    "S",         # безопасность
    "ASYNC",     # ошибки в async функциях
    "PT",        # единый стиль pytest
    "TC",        # импорты только для типов
    "ANN",       # аннотации типов
    "ERA",       # закомментированный код
    "T20",       # забытые print() и pprint()
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"] # игнорировать assert и магические значения в тестах
"src/manage.py" = ["PLC0415"]    # импорт внутри main() — так генерирует Django

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # разрешить *args: Any и **kwargs: Any

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
extra_checks = true
show_error_codes = true
show_error_code_links = true
show_column_numbers = true
warn_unreachable = true
pretty = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.django-stubs]
django_settings_module = "wish_list_config.settings"

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.pytest]
DJANGO_SETTINGS_MODULE = "wish_list_config.settings"
pythonpath = ["src"]
django_find_project = false
strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
]

[tool.coverage.run]
source = ["src", "deploy"]
branch = true
omit = [
    ".venv/*",
    "src/manage.py",
    "tests/*",
    "*/migrations/*",
    "src/wish_list_config/asgi.py",
    "src/wish_list_config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
